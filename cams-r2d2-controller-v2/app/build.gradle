plugins {
    id 'com.android.application'
}

def configuredControllerName = (project.findProperty('controllerName') ?: 'Cam').toString()
def escapedControllerName = configuredControllerName
        .replace('\\', '\\\\')
        .replace('"', '\\"')

android {
    namespace 'com.riddle.camsr2d2'
    compileSdk 35

    defaultConfig {
        applicationId 'com.riddle.r2d2controller'
        minSdk 26
        targetSdk 35
        versionCode 3
        versionName '2.1.0'
        buildConfigField 'String', 'DEFAULT_CONTROLLER_NAME', "\"${escapedControllerName}\""
    }

    buildFeatures {
        buildConfig true
    }

    buildTypes {
        debug {
            applicationIdSuffix '.debug'
            versionNameSuffix '-debug'
        }
        release {
            minifyEnabled false
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
