plugins {
    id 'com.android.application'
}

def configuredControllerName = (project.findProperty('controllerName') ?: 'Cam').toString()
def escapedControllerName = configuredControllerName
        .replace('\\', '\\\\')
        .replace('"', '\\"')

android {
    namespace 'com.riddle.camsr2d2'
    compileSdk 35

    signingConfigs {
        community {
            storeFile rootProject.file('signing/r2d2-community.keystore')
            storeType 'JKS'
            storePassword 'r2d2controller'
            keyAlias 'r2d2controller'
            keyPassword 'r2d2controller'
        }
    }

    defaultConfig {
        applicationId 'com.riddle.camsr2d2'
        minSdk 26
        targetSdk 35
        versionCode 5
        versionName '2.2.0'
        buildConfigField 'String', 'DEFAULT_CONTROLLER_NAME', "\"${escapedControllerName}\""
    }

    buildFeatures {
        buildConfig true
    }

    buildTypes {
        debug {
            applicationIdSuffix '.debug'
            versionNameSuffix '-debug'
        }
        release {
            minifyEnabled false
            signingConfig signingConfigs.community
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
