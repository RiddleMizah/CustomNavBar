name: Build R2-D2 Flipper APK

on:
  workflow_dispatch:
  push:
    branches:
      - agent/r2d2-flipper-controller
    paths:
      - 'r2d2-flipper-controller/**'
      - '.github/workflows/r2d2-flipper-build.yml'
  pull_request:
    paths:
      - 'r2d2-flipper-controller/**'
      - '.github/workflows/r2d2-flipper-build.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - uses: android-actions/setup-android@v3

      - name: Install Android SDK 34
        run: sdkmanager 'platforms;android-34' 'build-tools;34.0.0'

      - name: Build debug APK
        run: gradle --no-daemon -p r2d2-flipper-controller :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: R2D2-Flipper-Controller-APK
          path: r2d2-flipper-controller/app/build/outputs/apk/debug/app-debug.apk
