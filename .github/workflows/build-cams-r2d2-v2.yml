name: Build Cam's R2-D2 Controller V2

on:
  workflow_dispatch:
  push:
    branches:
      - agent/cams-r2d2-controller-v2
    paths:
      - 'cams-r2d2-controller-v2/**'
      - '.github/workflows/build-cams-r2d2-v2.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'cams-r2d2-controller-v2/**'
      - '.github/workflows/build-cams-r2d2-v2.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 35
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - name: Build debug APK
        run: gradle --no-daemon -p cams-r2d2-controller-v2 :app:assembleDebug

      - name: Build release APK
        run: gradle --no-daemon -p cams-r2d2-controller-v2 :app:assembleRelease

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: Cams-R2D2-Controller-V2-APKs
          path: |
            cams-r2d2-controller-v2/app/build/outputs/apk/debug/app-debug.apk
            cams-r2d2-controller-v2/app/build/outputs/apk/release/app-release-unsigned.apk
