name: Build Cam's R2-D2 v3.2.1 Final

on:
  workflow_dispatch:
  push:
    branches:
      - agent/cams-r2d2-controller-v3.2.1
    paths:
      - .github/workflows/cams-r2d2-v32-build.yml

permissions:
  contents: write

jobs:
  build-debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/cams-r2d2-controller-v3.2.1

      - name: Verify known-good v3.2.0 source
        shell: bash
        run: |
          echo 'df6a42bcfb79b8707613dfea924f106d1befcce7da511b116258f551455f45d8  Cams-R2D2-Controller-v3.2.0-Source.zip' | sha256sum -c -
          unzip -t Cams-R2D2-Controller-v3.2.0-Source.zip

      - name: Create final v3.2.1 source
        shell: bash
        run: |
          rm -rf buildsrc
          mkdir buildsrc
          unzip -q Cams-R2D2-Controller-v3.2.0-Source.zip -d buildsrc
          python3 - <<'PY'
          from pathlib import Path
          catalog = Path('buildsrc/app/src/main/java/com/riddle/camsr2d2/CommandCatalog.java')
          s = catalog.read_text()
          old_music = 'if(q.contains("music")||q.contains("tune")) ids=new int[]{148,149,150,165,166};'
          new_music = 'if(q.contains("music")||q.contains("tune")) ids=new int[]{148,149,150};'
          old_random = '    CommandItem randomCategory(String c){List<CommandItem> m=search("",c,5000);return m.isEmpty()?null:m.get((int)(Math.random()*m.size()));}'
          new_random = '''    CommandItem randomCategory(String c){
              List<CommandItem> m=search("",c,5000);
              if("PNum".equals(c)) {
                  List<CommandItem> safe=new ArrayList<>();
                  for(CommandItem item:m) if(item.id!=165&&item.id!=166) safe.add(item);
                  m=safe;
              }
              return m.isEmpty()?null:m.get((int)(Math.random()*m.size()));
          }'''
          if old_music not in s: raise SystemExit('Expected v3.2.0 music pool not found')
          if old_random not in s: raise SystemExit('Expected v3.2.0 randomCategory not found')
          s = s.replace(old_music, new_music).replace(old_random, new_random)
          catalog.write_text(s)

          gradle = Path('buildsrc/app/build.gradle')
          g = gradle.read_text()
          if "versionCode 320" not in g or "versionName '3.2.0'" not in g:
              raise SystemExit('Expected v3.2.0 version fields not found')
          g = g.replace('versionCode 320', 'versionCode 321').replace("versionName '3.2.0'", "versionName '3.2.1'")
          gradle.write_text(g)
          PY

          grep -F 'ids=new int[]{148,149,150};' buildsrc/app/src/main/java/com/riddle/camsr2d2/CommandCatalog.java
          grep -F 'item.id!=165&&item.id!=166' buildsrc/app/src/main/java/com/riddle/camsr2d2/CommandCatalog.java
          grep -F 'versionCode 321' buildsrc/app/build.gradle
          grep -F "versionName '3.2.1'" buildsrc/app/build.gradle

          (cd buildsrc && zip -qr ../Cams-R2D2-Controller-v3.2.1-Source.zip . -x '.gradle/*' -x 'app/build/*' -x 'build/*')
          sha256sum Cams-R2D2-Controller-v3.2.1-Source.zip > Cams-R2D2-Controller-v3.2.1-Source-SHA256.txt

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - uses: android-actions/setup-android@v3

      - name: Install Android SDK 35
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - name: Build final debug APK
        working-directory: buildsrc
        run: gradle --no-daemon :app:assembleDebug

      - name: Publish verified v3.2.1 outputs
        shell: bash
        run: |
          cp buildsrc/app/build/outputs/apk/debug/app-debug.apk Cams-R2D2-Controller-v3.2.1-Debug.apk
          sha256sum Cams-R2D2-Controller-v3.2.1-Debug.apk > Cams-R2D2-Controller-v3.2.1-Debug-SHA256.txt
          {
            echo "Cam's R2-D2 Controller v3.2.1 FINAL debug build"
            echo "Known-good v3.2.0 source SHA-256: df6a42bcfb79b8707613dfea924f106d1befcce7da511b116258f551455f45d8"
            echo "Build commit: $GITHUB_SHA"
            echo
            echo 'Final source:'
            cat Cams-R2D2-Controller-v3.2.1-Source-SHA256.txt
            echo
            echo 'Final APK:'
            cat Cams-R2D2-Controller-v3.2.1-Debug-SHA256.txt
          } > Cams-R2D2-Controller-v3.2.1-BUILD-SUCCESS.txt

          rm -f Cams-R2D2-Controller-v3.2.1-Debug-apk.part*.b64
          base64 -w 0 Cams-R2D2-Controller-v3.2.1-Debug.apk > Cams-R2D2-Controller-v3.2.1-Debug.apk.b64
          split -b 20000 -d -a 2 --additional-suffix=.b64 \
            Cams-R2D2-Controller-v3.2.1-Debug.apk.b64 \
            Cams-R2D2-Controller-v3.2.1-Debug-apk.part
          rm Cams-R2D2-Controller-v3.2.1-Debug.apk.b64

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Cams-R2D2-Controller-v3.2.1-Source.zip \
            Cams-R2D2-Controller-v3.2.1-Source-SHA256.txt \
            Cams-R2D2-Controller-v3.2.1-Debug.apk \
            Cams-R2D2-Controller-v3.2.1-Debug-SHA256.txt \
            Cams-R2D2-Controller-v3.2.1-BUILD-SUCCESS.txt \
            Cams-R2D2-Controller-v3.2.1-Debug-apk.part*.b64
          git commit -m 'Publish Cam R2-D2 v3.2.1 final verified build'
          git push

      - uses: actions/upload-artifact@v4
        with:
          name: Cams-R2D2-v3.2.1-Final
          path: |
            Cams-R2D2-Controller-v3.2.1-Debug.apk
            Cams-R2D2-Controller-v3.2.1-Source.zip
            Cams-R2D2-Controller-v3.2.1-BUILD-SUCCESS.txt
