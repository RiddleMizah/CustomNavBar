name: Build Cam's R2-D2 v3.2

on:
  workflow_dispatch:
  push:
    branches:
      - agent/cams-r2d2-controller-v3.2
    paths:
      - Cams-R2D2-Controller-v3.2.0-Source.zip
      - .github/workflows/cams-r2d2-v32-build.yml

jobs:
  build-debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK 35
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Unpack v3.2 source
        run: |
          rm -rf buildsrc
          mkdir buildsrc
          unzip -q Cams-R2D2-Controller-v3.2.0-Source.zip -d buildsrc
      - name: Build debug APK
        working-directory: buildsrc
        run: gradle --no-daemon :app:assembleDebug
      - name: Rename APK
        run: cp buildsrc/app/build/outputs/apk/debug/app-debug.apk Cams-R2D2-Controller-v3.2.0-Debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Cams-R2D2-v3.2.0-Debug-APK
          path: Cams-R2D2-Controller-v3.2.0-Debug.apk
