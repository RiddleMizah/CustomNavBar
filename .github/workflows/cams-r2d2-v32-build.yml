name: Build Cam's R2-D2 v3.2.1

on:
  workflow_dispatch:
  push:
    branches:
      - agent/cams-r2d2-controller-v3.2.1
    paths:
      - Cams-R2D2-Controller-v3.2.1-Source.zip

permissions:
  contents: write

jobs:
  build-debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/cams-r2d2-controller-v3.2.1

      - name: Verify v3.2.1 source
        shell: bash
        run: |
          echo 'fa8a3e4969b6296be1da489225243bcc3591b8d4e5b671820a53a1001005ea30  Cams-R2D2-Controller-v3.2.1-Source.zip' | sha256sum -c -
          unzip -t Cams-R2D2-Controller-v3.2.1-Source.zip

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - uses: android-actions/setup-android@v3

      - name: Install Android SDK 35
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - name: Unpack v3.2.1 source
        run: |
          rm -rf buildsrc
          mkdir buildsrc
          unzip -q Cams-R2D2-Controller-v3.2.1-Source.zip -d buildsrc

      - name: Build debug APK
        working-directory: buildsrc
        run: gradle --no-daemon :app:assembleDebug

      - name: Publish verified build outputs
        shell: bash
        run: |
          cp buildsrc/app/build/outputs/apk/debug/app-debug.apk Cams-R2D2-Controller-v3.2.1-Debug.apk
          sha256sum Cams-R2D2-Controller-v3.2.1-Debug.apk > Cams-R2D2-Controller-v3.2.1-Debug-SHA256.txt
          {
            echo "Cam's R2-D2 Controller v3.2.1 debug build"
            echo "Source SHA-256: fa8a3e4969b6296be1da489225243bcc3591b8d4e5b671820a53a1001005ea30"
            echo "Commit: $GITHUB_SHA"
            echo
            cat Cams-R2D2-Controller-v3.2.1-Debug-SHA256.txt
          } > Cams-R2D2-Controller-v3.2.1-BUILD-SUCCESS.txt

          rm -f Cams-R2D2-Controller-v3.2.1-Debug-apk.part*.b64
          base64 -w 0 Cams-R2D2-Controller-v3.2.1-Debug.apk > Cams-R2D2-Controller-v3.2.1-Debug.apk.b64
          split -b 20000 -d -a 2 --additional-suffix=.b64 \
            Cams-R2D2-Controller-v3.2.1-Debug.apk.b64 \
            Cams-R2D2-Controller-v3.2.1-Debug-apk.part
          rm Cams-R2D2-Controller-v3.2.1-Debug.apk.b64

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Cams-R2D2-Controller-v3.2.1-Debug.apk \
            Cams-R2D2-Controller-v3.2.1-Debug-SHA256.txt \
            Cams-R2D2-Controller-v3.2.1-BUILD-SUCCESS.txt \
            Cams-R2D2-Controller-v3.2.1-Debug-apk.part*.b64
          git commit -m 'Publish Cam R2-D2 v3.2.1 verified debug build'
          git push

      - uses: actions/upload-artifact@v4
        with:
          name: Cams-R2D2-v3.2.1-Debug-APK
          path: Cams-R2D2-Controller-v3.2.1-Debug.apk
